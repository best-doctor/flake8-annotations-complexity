[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flake8-annotations-complexity"
description = "A flake8 extension that checks for type annotations complexity"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Ilya Lebedev", email = "melevir@gmail.com" }]
keywords = ["flake8", "annotations"]
classifiers = [
    "Environment :: Console",
    "Framework :: Flake8",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["flake8>=5.0"]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/best-doctor/flake8-annotations-complexity"
Source = "https://github.com/best-doctor/flake8-annotations-complexity"
Issues = "https://github.com/best-doctor/flake8-annotations-complexity/issues"

[project.entry-points."flake8.extension"]
TAE002 = "flake8_annotations_complexity.checker:AnnotationsComplexityChecker"

[dependency-groups]
dev = [
    "flake8-pyproject>=1.2",
    "mypy>=1.18",
    "pip-audit>=2.9",
    "pre-commit>=4.2",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.14",
]

[tool.hatch.version]
path = "flake8_annotations_complexity/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["flake8_annotations_complexity"]

[tool.hatch.build.targets.sdist]
include = ["flake8_annotations_complexity", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["flake8_annotations_complexity"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_no_return = false
exclude = "^(build|tests)/"

[tool.flake8]
# General linting (line length included) is owned by ruff below. flake8 is kept
# solely to dogfood this plugin on its own source, so only TAE checks run here.
select = ["TAE"]
max-annotations-complexity = 4
max-annotations-len = 7
exclude = [".git", "__pycache__", "build", "dist", ".venv", "venv", "tests/test_files"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/test_files"]

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E", "W", # pycodestyle
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # bugbear
    "A",      # builtins shadowing
    "C4",     # comprehensions
    "T10",    # debugger
    "T20",    # print
    "SIM",    # simplify
    "PTH",    # pathlib
    "RUF",
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.format]
quote-style = "single"
